[package]
name = "nodespace-cli"
version.workspace = true
description = "Command-line interface for NodeSpace — a gRPC client for nodespaced"
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nodespace"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
tonic = "0.12"
tokio = { workspace = true }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
nodespace-daemon = { path = "../daemon" }
nodespace-proto = { workspace = true }
# For `flatten_namespaced_properties` — the single definition of the storage
# nesting → flat API shape rule this CLI's output must honour.
nodespace-types = { workspace = true }
# Already resolved in the workspace lockfile as a transitive dep of
# portable-pty (via the `session` PTY commands) — reused here for the same
# POSIX-shell-style argument splitting, applied to the `mcp` passthrough
# tool's `args` string.
shell-words = "1.1"
# Per-invocation random tag for `skill guidance`'s provenance banner (see
# `commands::skill::provenance_tag`) — the same OS-backed randomness
# `prepare_nodes_from_template` uses for node ids, so fetched graph content
# authored before a given call cannot predict or forge it.
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
nodespace-core = { workspace = true }
nodespace-agent = { workspace = true }
nodespace-nlp-engine = { workspace = true }
tempfile = "3.0"
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
