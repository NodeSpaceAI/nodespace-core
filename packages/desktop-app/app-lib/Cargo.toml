[package]
name = "nodespace-app-lib"
version.workspace = true
description = "NodeSpace desktop app library: Tauri commands, services and the run() entry point"
edition.workspace = true
publish = false

[lib]
name = "nodespace_app_lib"
# rlib only: there is no mobile target, so no staticlib/cdylib.
crate-type = ["rlib"]

[dependencies]
nodespace-types = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tauri-plugin-decorum = "1.1.1"
nodespace-proto = { workspace = true }
tonic = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
dirs = "5.0"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
async-trait = { workspace = true }
thiserror = { workspace = true }
# App update check: fetch the latest GitHub release (rustls, no OpenSSL) and
# compare versions with semver semantics.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
# SHA-256 check of the bundled embedding model before it is copied into place
# (ADR-058's pinned digest).
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the machine-wide launchd registration (XML or binary) for the notice
# about another product's service -- already in the lockfile through Tauri.
plist = "1.10"

[dev-dependencies]
tempfile = "3"
# `#[tokio::test(start_paused = true)]` lets the channel-rebuilt hook timeout be
# tested without waiting it out.
tokio = { workspace = true, features = ["test-util"] }
# Adds tauri::test (mock AppHandle with a real event bus, no webview) for the
# ADR-048 Tauri-seam integration tests — ONLY active for `cargo test`, since
# Cargo unifies dev-dependency features into the main build for test targets
# but not for the release binary.
tauri = { version = "2", features = ["test"] }
# Shared fixtures for the ADR-048 Tauri-seam integration tests under tests/ —
# its own crate (not a `mod support;` duplicated per test binary) so clippy's
# dead-code lint sees one compilation used across every test file, not each
# binary's own unused subset (see test-support/src/lib.rs's module doc).
nodespace-app-test-support = { path = "test-support" }
