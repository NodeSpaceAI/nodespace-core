[package]
name = "nodespace-app"
version = "0.3.2"
description = "NodeSpace AI-Native Knowledge Management Desktop Application"
authors = ["NodeSpace Team"]
edition = "2021"
default-run = "nodespace-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The bundle-staging helpers `build.rs` runs before `tauri_build::build()`.
nodespace-app-build = { path = "../app-build" }

[[bin]]
name = "nodespace-app"
path = "src/main.rs"

# Note: dev-proxy and dev-mcp have been moved to packages/dev-tools
# to exclude them from Tauri release builds

# Opt-in Safari Web Inspector access for the packaged WKWebView (dev builds
# only — `bun run tauri:dev` passes --features devtools; release/bundle
# scripts never do, so shipped builds stay uninspectable).
[features]
devtools = ["tauri/devtools"]

[dependencies]
nodespace-app-lib = { path = "../app-lib" }
# `tauri_build`'s manifest check and `generate_context!` need `tauri` as a
# direct dependency of the crate that owns tauri.conf.json.
tauri = { version = "2", features = [] }
# Direct dependencies only for their permission files: `tauri_build` grants
# `capabilities/default.json`'s `opener:default` and `dialog:default` from the
# app crate's own direct dependencies, so dropping either fails
# `validate_capabilities`. The plugins themselves are initialised in
# nodespace-app-lib's `run()`.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
