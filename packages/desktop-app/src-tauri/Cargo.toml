[package]
name = "nodespace-app"
version = "0.3.4"
description = "NodeSpace AI-Native Knowledge Management Desktop Application"
authors = ["NodeSpace Team"]
edition = "2021"
default-run = "nodespace-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The bundle-staging helpers `build.rs` runs before `tauri_build::build()`.
nodespace-app-build = { path = "../app-build" }

[[bin]]
name = "nodespace-app"
path = "src/main.rs"

# Note: dev-proxy and dev-mcp have been moved to packages/dev-tools
# to exclude them from Tauri release builds

# Opt-in Safari Web Inspector access for the packaged WKWebView (dev builds
# only — `bun run tauri:dev` passes --features devtools; release/bundle
# scripts never do, so shipped builds stay uninspectable).
[features]
devtools = ["tauri/devtools"]

[dependencies]
nodespace-app-lib = { path = "../app-lib" }
# `tauri_build`'s manifest check and `generate_context!` need `tauri` as a
# direct dependency of the crate that owns tauri.conf.json.
tauri = { version = "2", features = [] }
# Direct dependencies only for their permission files. Core's window
# capability, which nodespace-app-lib adds at startup, grants `opener:default`
# and `dialog:default`, and Tauri resolves it against the ACL `tauri_build`
# builds from this crate's direct dependencies only. Dropping either panics at
# startup; `window_capability_tests` catches it first. The plugins themselves
# are initialised in nodespace-app-lib's `run()`.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
# `tauri::test::MockRuntime`, to build this crate's real context and ACL in
# `window_capability_tests`. Cargo enables a dev-dependency's features only for
# test builds, so the app binary is unaffected.
tauri = { version = "2", features = ["test"] }
serde_json = { workspace = true }
toml = "0.8"
