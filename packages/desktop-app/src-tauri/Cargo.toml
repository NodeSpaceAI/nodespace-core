[package]
name = "nodespace-app"
version = "0.2.10"
description = "NodeSpace AI-Native Knowledge Management Desktop Application"
authors = ["NodeSpace Team"]
edition = "2021"
default-run = "nodespace-app"

[lib]
name = "nodespace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Pro-tier proto compilation (nodespace.pro.v1 — vendored from
# nodespace-sync via scripts/refresh-pro-proto.ts).
tonic-build = "0.12"
protoc-bin-vendored = "3"

[[bin]]
name = "nodespace-app"
path = "src/main.rs"

# Note: dev-proxy and dev-mcp have been moved to packages/dev-tools
# to exclude them from Tauri release builds

# Opt-in Safari Web Inspector access for the packaged WKWebView (dev builds
# only — `bun run tauri:dev` passes --features devtools; release/bundle
# scripts never do, so shipped builds stay uninspectable).
[features]
devtools = ["tauri/devtools"]

[dependencies]
nodespace-types = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tauri-plugin-decorum = "1.1.1"
nodespace-proto = { workspace = true }
tonic = "0.12"
prost = { workspace = true }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
dirs = "5.0"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
async-trait = { workspace = true }
thiserror = { workspace = true }
# App update check: fetch the latest GitHub release (rustls, no OpenSSL) and
# compare versions with semver semantics.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"

[dev-dependencies]
tempfile = "3"
# Adds tauri::test (mock AppHandle with a real event bus, no webview) for the
# ADR-048 Tauri-seam integration tests — ONLY active for `cargo test`, since
# Cargo unifies dev-dependency features into the main build for test targets
# but not for the release binary.
tauri = { version = "2", features = ["test"] }
# Shared fixtures for the ADR-048 Tauri-seam integration tests under tests/ —
# its own crate (not a `mod support;` duplicated per test binary) so clippy's
# dead-code lint sees one compilation used across every test file, not each
# binary's own unused subset (see test-support/src/lib.rs's module doc).
nodespace-app-test-support = { path = "test-support" }
