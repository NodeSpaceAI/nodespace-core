syntax = "proto3";

// Pro-tier gRPC services exposed by `nodespaced-pro`. The community
// `nodespaced` binary has no knowledge of this package — the Tauri
// frontend discovers Pro by probing for one of these RPCs at startup
// (absence => community tier).
//
// See nodespace-sync #40 and #41 for the design.

package nodespace.pro.v1;

// CloudSyncService — bridges the local SurrealDB to SurrealDB Cloud.
//
// Field shapes mirror the in-process orchestrator that lives in
// `nodespace-sync::CloudSyncService`. The gRPC layer is a thin
// adapter; conflict resolution, echo prevention, and stamping all
// happen below this surface.
service CloudSyncService {
  // Begin an OAuth PKCE sign-in. The daemon hosts the localhost
  // callback listener and opens the system browser. Auth state is
  // observed via WatchSyncStatus.
  rpc InitiateOAuth (InitiateOAuthRequest) returns (InitiateOAuthResponse);

  // One-shot bulk-stamp migration of pre-existing local nodes into
  // a Pro collection. Progress events stream until done or error.
  rpc InitiateMigration (MigrationRequest) returns (stream MigrationProgressEvent);

  // Long-lived subscription to sync orchestrator state. Replaces the
  // in-process Tauri event bus from the archived scaffold.
  rpc WatchSyncStatus (WatchSyncStatusRequest) returns (stream SyncStatusEvent);

  // Force an immediate reconcile cycle (push pending + pull recent).
  // No-op if the orchestrator is already in SYNCING.
  rpc TriggerSync (TriggerSyncRequest) returns (TriggerSyncResponse);

  // Explicit sign-out (#199 S6). Drops the in-memory token, wipes the
  // persisted refresh token from the OS keychain (so a daemon restart
  // does NOT auto-resume), and tears down the live sync connection —
  // the orchestrator loop then reports AUTH_REQUIRED. Idempotent.
  rpc SignOut (SignOutRequest) returns (SignOutResponse);

  // Opt-in to cloud sync for the active database. Flips the
  // DatabaseSettingsNode `sync_enabled` flag to true (the writer the Pro-sync
  // UI's enable-prompt variant needs). Called by the first-Pro consent modal
  // before it starts the OAuth sign-in. Idempotent.
  rpc EnableSync (EnableSyncRequest) returns (EnableSyncResponse);

  // Switch the cloud-sync session to follow a different local database
  // (ADR-053 single-active sync). Deactivates the currently-syncing database's
  // session and activates the target's: reads the target's bound tenant and —
  // if it is bound — starts a fresh orchestrator against that tenant's schema,
  // reusing the signed-in session (the Supabase JWT is tenant-agnostic). An
  // empty database_id, or a target with no bound tenant, leaves sync
  // deactivated: the database is local-only until it is bound. Idempotent for
  // the already-active database. The desktop calls this from its
  // switch-database action so a tenant switch re-targets sync, not just reads.
  rpc ActivateDatabase (ActivateDatabaseRequest) returns (ActivateDatabaseResponse);

  // Bind a local database to a cloud tenant and start syncing it (ADR-053
  // per-database cloud sync). Writes the tenant binding to the database's
  // settings (authoritative) and the registry display mirror, then activates the
  // database so a local-only one becomes synced in a single call
  // (activate-on-bind). An empty database_id targets the active/default database;
  // an empty schema unbinds (the database goes local-only). Rebinding to a
  // different tenant re-targets sync. The full multi-tenant switch flow: create a
  // database, BindTenant it to a tenant, and thereafter ActivateDatabase to
  // switch between bound tenants.
  rpc BindTenant (BindTenantRequest) returns (BindTenantResponse);

  // --- Team membership (M5, #147). Thin adapters over the cloud
  // membership RPCs; the daemon forwards the signed-in user's JWT, so
  // the same admin / last-admin / open-vs-restricted gates apply
  // server-side. No UI wired yet — these exist for tests + a future UI.
  rpc SetMember (SetMemberRequest) returns (MembershipAck);
  rpc RemoveMember (RemoveMemberRequest) returns (MembershipAck);
  rpc LeaveCollection (LeaveCollectionRequest) returns (MembershipAck);
  rpc ListMembers (ListMembersRequest) returns (ListMembersResponse);
  rpc CreateInvite (CreateInviteRequest) returns (CreateInviteResponse);
  rpc AcceptInvite (AcceptInviteRequest) returns (MembershipAck);
  rpc RequestJoin (RequestJoinRequest) returns (RequestJoinResponse);
  // Open-collection self-join — the complement to RequestJoin (which is for
  // restricted collections). The cloud RPC rejects a restricted collection with
  // 42501, so the open-vs-restricted gate is enforced server-side.
  rpc JoinCollection (JoinCollectionRequest) returns (MembershipAck);
  rpc ApproveRequest (ApproveRequestRequest) returns (MembershipAck);

  // --- Invite / request listings + revocation (S2, #239). These three cloud
  // RPCs existed only in Postgres (no daemon/Tauri binding), so a client could
  // mint/accept an invite but never list the pending ones or cancel one. Wiring
  // them here completes the admin surface. Same JWT-forwarding + server-side
  // admin gate as the eight above (a non-admin gets 42501 → PERMISSION_DENIED).
  rpc ListInvites (ListInvitesRequest) returns (ListInvitesResponse);
  rpc ListRequests (ListRequestsRequest) returns (ListRequestsResponse);
  rpc RevokeInvite (RevokeInviteRequest) returns (MembershipAck);

  // Collection discovery (browse & join). Lists the collections the signed-in user
  // could join but isn't a member of yet (open + restricted), so the client can
  // offer Join / Request without the collection id being shared out of band. Thin
  // adapter over the cloud `list_joinable_collections` RPC (JWT-forwarded; the RPC
  // filters to what the caller can see and excludes their memberships server-side).
  rpc ListJoinableCollections (ListJoinableCollectionsRequest) returns (ListJoinableCollectionsResponse);

  // Caller identity (#238/#239). Returns THIS device's bound PersonNode id (+
  // the signed-in email) so the UI can tell which roster row is "me" and gate
  // admin controls on the caller's own per-collection role. A dedicated one-shot
  // query rather than threading person_id through the SyncStatusEvent stream:
  // identity is stable per session (set at bind, cleared at sign-out), so the
  // client fetches once on connect and clears on sign-out — keeping the hot
  // status path untouched. person_node_id is empty when the bind hasn't landed.
  rpc GetIdentity (GetIdentityRequest) returns (GetIdentityResponse);

  // Discovery-driven sign-in (#409): enumerate the caller's tenants via
  // public.my_tenant_memberships() and return them with the authoritative status,
  // plus a selection hint the UI uses to drive 0 -> no-workspace, 1 -> auto-select,
  // N -> picker. The picker's chosen tenant is bound via BindTenant.
  rpc ListTenantMemberships (ListTenantMembershipsRequest) returns (ListTenantMembershipsResponse);

  // Tenant-wide user management (#284, ADR-066 Decision 2: owner / tenant-admin /
  // member). Thin JWT-forwarding callers over the live cloud RPCs; the cloud
  // enforces every gate (owner/admin predicates, exactly-one-owner, person-node
  // protection), the daemon adds no authorization of its own.
  rpc ListTenantMembers (ListTenantMembersRequest) returns (ListTenantMembersResponse);
  rpc SetTenantRole (SetTenantRoleRequest) returns (MembershipAck);
  rpc TransferOwnership (TransferOwnershipRequest) returns (MembershipAck);
}

// --- Messages -----------------------------------------------------

message InitiateOAuthRequest {
  // Worker base URL (e.g. "http://127.0.0.1:8787"). The daemon
  // appends /authorize and /token.
  string worker_url = 1;
  // Hint passed to the worker login form so the user knows which
  // account they're signing into (typically the local OS username).
  string user_hint = 2;
  // Social OAuth provider to sign in with. Empty = the Worker-brokered
  // email/password flow (default). "google" = sign in directly against
  // Supabase GoTrue's provider OAuth (PKCE), bypassing the Worker form.
  // The Worker is still used for the later refresh grant regardless.
  string provider = 3;
}

message InitiateOAuthResponse {
  // Opaque ID for correlating this auth attempt with WatchSyncStatus
  // events if/when we surface per-attempt state.
  string attempt_id = 1;
}

message MigrationRequest {
  // Access-tag collection key to stamp every migrated node with.
  string collection = 1;
}

message MigrationProgressEvent {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    SCANNING          = 1;
    STAMPING          = 2;
    UPLOADING         = 3;
    DONE              = 4;
    ERROR             = 5;
  }
  Phase phase = 1;
  int64 nodes_processed = 2;
  int64 nodes_total = 3;
  string detail = 4;
}

message WatchSyncStatusRequest {}

message SyncStatusEvent {
  enum State {
    STATE_UNSPECIFIED = 0;
    DISCONNECTED      = 1;
    CONNECTING        = 2;
    AUTHENTICATING    = 3;
    AUTH_REQUIRED     = 4;
    SYNCING           = 5;
    CONNECTED         = 6;
    ERROR             = 7;
    // Terminal states (sync#371): the session is stopped, ALL local data is
    // retained, and the outbox is parked (no retry loop, no discard). They differ
    // only in copy + recoverability.
    // Removed from the workspace — recovery only via a fresh invite.
    EVICTED               = 8;
    // Subscription lapsed — cached data stays (local-only mode); re-subscription
    // within the retention window drains the parked outbox and sync resumes.
    SUBSCRIPTION_EXPIRED  = 9;
  }
  State state = 1;
  // Free-form context, e.g. error message or current LIVE SELECT cursor.
  string detail = 2;
  // Email of the signed-in user, decoded from the session JWT. Empty when
  // signed out / not yet authenticated. Lets the UI show a "signed in as
  // <email>" affordance on the silent-resume path (#199 S6), where the
  // frontend never sees an OAuth response and so otherwise has no identity.
  string user_email = 3;
}

message TriggerSyncRequest {}
message TriggerSyncResponse {}

message SignOutRequest {}
message SignOutResponse {}

message EnableSyncRequest {}
message EnableSyncResponse {}

message ActivateDatabaseRequest {
  // Registry id of the database to make the active cloud-sync target. Empty =
  // deactivate the current session (go local-only, no cloud connection).
  string database_id = 1;
}
message ActivateDatabaseResponse {
  // True when a cloud-sync session was started (the target is bound to a
  // tenant); false when the target is local-only or sync was deactivated.
  bool synced = 1;
  // The tenant schema now syncing; empty when local-only / deactivated.
  string schema = 2;
}

message BindTenantRequest {
  // Registry id of the database to bind; empty = the active/default database.
  string database_id = 1;
  // Tenant schema to bind to, e.g. "tenant_demo"; empty = unbind (local-only).
  string schema = 2;
  // Default collection id within the tenant (the member_of target for new
  // nodes). Ignored when schema is empty.
  string collection = 3;
}
message BindTenantResponse {
  // True when binding started a cloud-sync session (the schema is non-empty);
  // false on unbind (the database is now local-only).
  bool synced = 1;
  // The tenant schema now bound/syncing; empty when unbound.
  string schema = 2;
}

// --- Team membership (M5, #147) ----------------------------------
// permission is "admin" | "modify" | "readOnly". collection_id / person_id are
// node ids (TEXT). The daemon forwards the caller's JWT to the cloud RPCs.

message SetMemberRequest {
  string collection_id = 1;
  string person_id = 2;
  string permission = 3;
}
message RemoveMemberRequest {
  string collection_id = 1;
  string person_id = 2;
}
message LeaveCollectionRequest {
  string collection_id = 1;
}
message ListMembersRequest {
  string collection_id = 1;
}
message Member {
  string person_id = 1;
  string permission = 2;
}
message ListMembersResponse {
  repeated Member members = 1;
}
message CreateInviteRequest {
  string collection_id = 1;
  string permission = 2;
  // Optional invitee email; when set, the invite is bound to it (only that
  // signed-in user may redeem). Empty => a bearer share-code.
  string email = 3;
  // Optional lifetime; 0 => server default (7 days).
  uint64 ttl_secs = 4;
}
message CreateInviteResponse {
  string code = 1;
}
message AcceptInviteRequest {
  string code = 1;
}
message RequestJoinRequest {
  string collection_id = 1;
}
message RequestJoinResponse {
  string request_id = 1;
}
message JoinCollectionRequest {
  string collection_id = 1;
}
message ApproveRequestRequest {
  string request_id = 1;
  // Optional tier override; empty => the requested tier.
  string permission = 2;
}
// Generic ack for membership mutations. `detail` is "ok" for SetMember /
// RemoveMember / LeaveCollection / ApproveRequest / RevokeInvite; for
// AcceptInvite it is the joined collection id (so the caller can pull it).
message MembershipAck {
  string detail = 1;
}

// --- Invite / request listings + revocation (S2, #239) -----------

message ListInvitesRequest {
  string collection_id = 1;
}
// A pending invite (list_invites returns only status='pending' rows, admin-only).
message Invite {
  string id = 1;          // uuid — the handle RevokeInvite takes
  string code = 2;        // 64-hex share code (bearer); may be surfaced to copy
  string email = 3;       // bound invitee email; empty for a bearer share-code
  string permission = 4;  // "admin" | "modify" | "readOnly"
  string expires_at = 5;  // RFC3339; empty when the invite never expires
}
message ListInvitesResponse {
  repeated Invite invites = 1;
}
message ListRequestsRequest {
  string collection_id = 1;
}
// A pending join request (status='requested', admin-only).
message JoinRequest {
  string id = 1;            // uuid — ApproveRequest / RevokeInvite handle
  string requested_by = 2;  // requester's person_node_id
  string created_at = 3;    // RFC3339
}
message ListRequestsResponse {
  repeated JoinRequest requests = 1;
}
message RevokeInviteRequest {
  string invite_id = 1;  // uuid of the pending invite OR join request to cancel
}

// --- Collection discovery (browse & join) ------------------------
message ListJoinableCollectionsRequest {}
// A collection the caller could join but isn't a member of yet.
message JoinableCollection {
  string id = 1;          // collection node id
  string name = 2;        // display name (the collection node's content)
  bool restricted = 3;    // true => needs a request (admin approval); false => open self-join
}
message ListJoinableCollectionsResponse {
  repeated JoinableCollection collections = 1;
}

// --- Caller identity (S1/S2, #238/#239) --------------------------
message GetIdentityRequest {}
message GetIdentityResponse {
  string person_node_id = 1;  // empty until the identity bind lands
  string email = 2;           // signed-in email; empty when signed out
}

// --- Discovery-driven sign-in (#409) ------------------------------
message ListTenantMembershipsRequest {}
message TenantMembershipInfo {
  string tenant_id = 1;  // tenant id (the billable unit)
  string schema = 2;     // tenant schema (tenant_<id>); may be empty if not returned
  string status = 3;     // pending | active | suspended | removed
  string role = 4;       // owner | tenant-admin | member (open set); may be empty
}
message ListTenantMembershipsResponse {
  // Every tenant the caller belongs to, with its authoritative registry status.
  repeated TenantMembershipInfo memberships = 1;
  // Selection hint derived from the ACTIVE memberships. The UI drives the flow from
  // this rather than re-deriving it, so daemon and client agree on the count.
  enum Selection {
    NO_WORKSPACE = 0;  // zero active tenants
    AUTO_SELECT  = 1;  // exactly one active tenant -> auto-select it
    PICKER       = 2;  // more than one active tenant -> show a picker
  }
  Selection selection = 2;
  // Populated only when selection == AUTO_SELECT: the single active tenant to bind.
  TenantMembershipInfo auto_selected = 3;
}

// --- Tenant-wide user management (#284) ---------------------------
message ListTenantMembersRequest {}
message TenantMember {
  string person_id = 1;  // person node id (the has_role edge subject)
  string email = 2;      // signed-in email, if known
  string role = 3;       // owner | tenant-admin | member
  string status = 4;     // pending | active
}
message ListTenantMembersResponse {
  repeated TenantMember members = 1;
}
message SetTenantRoleRequest {
  string person_id = 1;  // target person node
  string role = 2;       // owner | tenant-admin | member
}
message TransferOwnershipRequest {
  string person_id = 1;  // the person to make the new sole owner
}
