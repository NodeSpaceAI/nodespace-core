[package]
name = "nodespace-core"
version.workspace = true
description = "NodeSpace core business logic and database layer"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["nlp"]
nlp = ["dep:nodespace-nlp-engine"]

[dependencies]
nodespace-types = { workspace = true }

# Database - SQLite via libsql
libsql = { workspace = true }
# Vector search extension (statically linked, registered via sqlite3_auto_extension)
sqlite-vec = { workspace = true }

# NLP Engine for embeddings (optional — gate with the `nlp` feature)
nodespace-nlp-engine = { path = "../nlp-engine", optional = true }

# Async runtime
tokio = { workspace = true }
futures = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
regex = "1.0"
pulldown-cmark = "0.11"
sha2 = "0.10"

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server for MCP
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace"] }
tower = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
cel-interpreter = { version = "0.10.0", features = ["json"] }
cel-parser = "0.10"
cron = "0.16"

[target.'cfg(windows)'.dependencies]
# libsql-sys 0.8's default (non-"rusqlite") connection-open path opens the
# database file via `std::os::unix::ffi::OsStrExt::as_bytes()`, which is
# Unix-only and doesn't compile on Windows at all (no cfg gate, no
# Windows-side fallback in that version). The "rusqlite" feature switches
# libsql-sys onto its other, already-cross-platform connection-open path,
# which delegates path handling to the `rusqlite` crate instead of doing
# its own raw-FFI OsStr-to-CString conversion.
#
# Upstream fixed the raw-FFI path itself in libsql-sys 0.9+ (added a
# `#[cfg(not(unix))]` branch using `Path::to_str`), which would be the more
# direct fix, but bumping libsql/libsql-sys three minor versions is out of
# scope for a Windows-only compile fix and risks pulling in different
# transitive deps than the ones the `default-features = false` above (see
# .cargo/audit.toml) was tuned around. Scoping this to `cfg(windows)` keeps
# macOS/Linux on the exact dependency graph they already build and test
# against.
libsql-sys = { version = "0.8", features = ["rusqlite"] }

[dev-dependencies]
tokio-test = { workspace = true }
# "test-util" enables `#[tokio::test(start_paused = true)]` + `tokio::time::advance`,
# used to verify CronRunner's 60-second poll loop actually ticks without a real
# 60-second wait, without weakening the runtime tokio ships in non-test builds
# (this is a [dev-dependencies]-only feature addition).
tokio = { workspace = true, features = ["test-util"] }
http-body-util = "0.1"
criterion = { workspace = true }
tempfile = "3.0"
proptest = { workspace = true }

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "query_crud"
harness = false
