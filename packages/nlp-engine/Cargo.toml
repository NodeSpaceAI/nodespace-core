[package]
name = "nodespace-nlp-engine"
version.workspace = true
description = "NodeSpace unified vector embedding service using llama.cpp"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# llama.cpp for embeddings and chat via Rust bindings
# Supports Metal (macOS), CUDA (NVIDIA), Vulkan (cross-platform)
# v0.1.141 includes the pooling fix for nomic-embed-text (llama.cpp #12561)
# v0.1.146 ships apply_chat_template_oaicompat with Jinja support required for Gemma 4,
# and vendors llama.cpp commit e21cdc11 (2026-04-13) — 123 commits past build b8660
# (2026-04-03), fixing tool-call failures in native tool-call parsing
llama-cpp-2 = { version = ">=0.1.146", optional = true }

# UTF-8 decoder for token_to_piece API (llama-cpp-2 >= 0.1.140)
encoding_rs = { version = "0.8", optional = true }

# System memory probe for sizing the chat KV cache to available memory at load
# time (avoids a fixed 32K allocation OOMing large models on constrained RAM).
sysinfo = { version = "0.33", optional = true }

# Caching layer
lru = "0.12"

# SHA-256 for load-time model-integrity verification (ADR-058)
sha2 = "0.10"

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# atexit handler for GPU cleanup before C++ static destructors
libc = "0.2"

# Path utilities
dirs = "5.0"

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { workspace = true }
tempfile = "3.0"
futures = "0.3"
# Serializes the model-loading integration tests so concurrent first-time
# llama.cpp/Metal backend initialization cannot happen under the parallel harness.
serial_test = "3.2"

[features]
default = ["embedding-service", "chat-service"]
embedding-service = ["llama-cpp-2"]
chat-service = ["llama-cpp-2", "encoding_rs", "sysinfo"]

# GPU acceleration features
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]

# Platform-specific: Enable Metal acceleration on macOS by default
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = ">=0.1.146", features = ["metal"], optional = true }
