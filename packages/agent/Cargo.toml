[package]
name = "nodespace-agent"
version.workspace = true
description = "Agent subsystem: local inference, ACP transport, tool execution"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nodespace-core = { workspace = true }
nodespace-nlp-engine = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "stream", "json"] }
sha2 = "0.10"
uuid = { workspace = true }
futures = "0.3"
regex = "1"
minijinja = "2"
dirs = "5.0"
sysinfo = "0.33"
which = "7"
portable-pty = "0.8"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "http-proto", "reqwest-rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Exposes test-only hooks (e.g. `LocalAgentService::set_system_prompt`,
# `AgentSession::system_prompt_override`, `PtySession::launch_for_test`) so
# integration tests in `tests/` can inject prebuilt prompts and spawn shell
# utilities without a real agent binary on PATH. The `tests/` binaries link
# against the library in non-test mode, so `#[cfg(test)]` alone is not
# enough — this feature gate is what keeps the hooks out of production
# builds while making them visible to integration tests run with
# `--features testing`.
#
# Footgun: Cargo unifies features across dep/dev-dep within a single
# downstream package. If a sibling crate (e.g. nodespace-daemon) depends on
# nodespace-agent as a regular dependency *and* as a dev-dependency with
# `features = ["testing"]`, then during `cargo test -p that-crate` the
# downstream's *production* code links against this crate with the
# `testing` feature enabled. That is currently safe — every gate behind
# `testing` only widens visibility (pub(crate) → pub) without changing
# runtime behavior. Keep it that way: do not put `#[cfg(feature =
# "testing")]` on code that mutates state, swaps implementations, or skips
# safety checks. Test-only stubs belong in test-only modules in the
# downstream crate, not behind this feature flag.
testing = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
# Line-level diff rendering for the prompt-assembly snapshot gate
# (tests/prompt_assembly_snapshot.rs) — the same crate `insta` uses
# internally for its own diff output. No other test in this crate needs a
# byte-blob failure to read as "which line moved", so it is a dev-only dep.
similar = "2"
# Same version already pulled in as a regular dependency (used by
# PromptAssembler::render_template) — declared here too so the same
# prompt_assembly_snapshot.rs test can render a seed body through Minijinja
# itself, reproducing assemble()'s exact render step rather than a
# reimplementation of it.
minijinja = "2"
# Captures the agent loop's REAL emitted log lines for the decision-marker
# golden (tests/decision_marker_golden.rs). The golden must hold lines the
# production tracing layer actually produced — a hand-built string would pin
# the fixture to itself rather than to the emitter, which is the drift this
# test exists to catch. Configured to match the daemon's own `fmt()` default.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "search_skills_latency"
path = "tests/search_skills_latency.rs"
