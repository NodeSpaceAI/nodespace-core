name = "current-user-assign-to-me"
reps = 5

notes = """
PRODUCTION-SHAPED resident prompt; tool surface trimmed to the tools the two
turns choose between. See current-user-my-name.toml for what the three
current-user probes measure and why they are separate files.

Scenario: a write whose target is the user, named only as "me". Two turns,
chained: turn 1 finds the task so that turn 2's task id is a real tool
result; turn 2 is the subject.

A task's assignee is a relationship to a person node (`person.tasks`, read
from the task side as `assignee`), so the write needs the person's node ID —
the name is not enough. That id is what the `Current user:` line carries, and
this case is the one that measures whether it is used: the id must reach the
call without a search for the user.

WHERE THIS DEPARTS FROM PRODUCTION

`create_relationship`'s description here states the relation's name and
direction outright ("from_id is the task, to_id is the person,
relationship_type is \"assignee\""); production's does not. That is
deliberate: with the name and direction given, the person id is the only
thing the turn has to supply, so a miss is a miss on the identity line. A
pass here says nothing about whether production's own description gets the
direction right.

MEASURED

Locked model, 5 reps: 5/5 `create_relationship` from the task id to the
person node id as `assignee`. No search for the user, no clarifying question.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the task. Exists so turn 2's task id is a real tool result.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-task"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

Current date: 2026-06-15
Active model: gemma-4-E4B-it-Q4_K_M
Current user: Ada Lovelace <ada@example.com> (person node 5c1e9a47-2d83-4b6f-8e10-7a3f9d2c4b65). "me", "my" and "I" refer to this person.

COLLECTIONS:
- Engineering — Design notes, ADRs and tickets for the product team
- Q3 Planning
"""
user = "Find the task about rotating the signing keys"
expect = """
search_nodes(query="rotating the signing keys", node_type="task") or a close \
wording of it. Not the subject of this case.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "b84d2f60-91c7-4e3a-a5d8-0f6c1e7b3924", "title": "Rotate the release signing keys", "node_type": "task", "properties": {"status": "open"}}], "count": 1}
  """

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. Use when the node you need is not already \
  identified in this conversation.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id."

# ---------------------------------------------------------------------------
# Turn 2 — the assignment. The case's real subject.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-assign-to-me"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

Current date: 2026-06-15
Active model: gemma-4-E4B-it-Q4_K_M
Current user: Ada Lovelace <ada@example.com> (person node 5c1e9a47-2d83-4b6f-8e10-7a3f9d2c4b65). "me", "my" and "I" refer to this person.

COLLECTIONS:
- Engineering — Design notes, ADRs and tickets for the product team
- Q3 Planning
"""
user = "Assign this to me"
expect = """
create_relationship linking the task from turn 1's real tool result \
("b84d2f60-91c7-4e3a-a5d8-0f6c1e7b3924") and the person node id from the \
Current user line ("5c1e9a47-2d83-4b6f-8e10-7a3f9d2c4b65"), as `assignee` \
from the task or `tasks` from the person. Three misses worth telling apart: \
a search for the user (the id was already in the prompt), the user's NAME \
where an id belongs, and a question asking who "me" is.
"""

  [turn.tool_results]
  create_relationship = '{"ok": true}'

  [[turn.tool]]
  name = "create_relationship"
  description = """
  Record a named relationship between two existing records, given both ids. \
  A task's assignee is a relationship to a person: from_id is the task, \
  to_id is the person, relationship_type is "assignee".
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["from_id", "to_id", "relationship_type"]

      [turn.tool.parameters_schema.properties.from_id]
      type = "string"
      description = "Id of the record the relationship starts from. A node id, never a title or a name."

      [turn.tool.parameters_schema.properties.to_id]
      type = "string"
      description = "Id of the record the relationship points at. A node id, never a title or a name."

      [turn.tool.parameters_schema.properties.relationship_type]
      type = "string"
      description = "The relation's name, lowercase snake_case (e.g. assignee, blocks)."

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. Use when the node you need is not already \
  identified in this conversation.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id."

  [[turn.tool]]
  name = "route_clarify"
  description = "Ask the user one question when the request cannot be acted on as stated."

    [turn.tool.parameters_schema]
    type = "object"
    required = ["question"]

      [turn.tool.parameters_schema.properties.question]
      type = "string"
      description = "The question to ask."
