name = "current-user-my-name"
reps = 5

notes = """
PRODUCTION-SHAPED resident prompt; tool surface trimmed to the three read
tools. One of three independent probes of the `Current user:` line the
Workspace Context Template renders (the others: current-user-my-email,
current-user-assign-to-me). Separate files because turns in one file chain.

Scenario: the user refers to themself by pronoun only. Before the line
existed there was no identity anywhere in the prompt, and "search for my
name" produced
`search_semantic("my name associated with my account in this chat session")`
— the pronoun passed through as the query, and nothing was found.

What the line has to buy: "my name" becomes the name on the line, or the
person node id on the line, with no round trip to the user.

CONTAMINATION GUARD

The identity (Ada Lovelace, and her person node id) is the one the
prompt-assembly snapshot fixture uses. It appears in no eval fixture and no
guidance text.

MEASURED

Locked model, 5 reps: 5/5 `search_nodes({"query":"Ada Lovelace"})`.
"""

[[turn]]
label = "search-for-my-name"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

Current date: 2026-06-15
Active model: gemma-4-E4B-it-Q4_K_M
Current user: Ada Lovelace <ada@example.com> (person node 5c1e9a47-2d83-4b6f-8e10-7a3f9d2c4b65). "me", "my" and "I" refer to this person.

COLLECTIONS:
- Engineering — Design notes, ADRs and tickets for the product team
- Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev, in_dev, ready_for_review, in_review, done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "Search for my name"
expect = """
A search whose query is the name from the Current user line — \
search_nodes(query="Ada Lovelace") or search_semantic(query="Ada Lovelace") — \
or get_node on the person node id. The miss is a query that still carries the \
pronoun ("my name", "the user's name"), and the other miss is asking the \
user what their name is.
"""

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. Use when the node you need is not already \
  identified in this conversation.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id."

  [[turn.tool]]
  name = "search_semantic"
  description = """
  Find nodes semantically related to a natural-language query. Use only for \
  meaning-based or fuzzy questions; prefer search_nodes when you know the \
  name or type.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Natural-language description of what to find."

  [[turn.tool]]
  name = "get_node"
  description = "Get a node by ID. Returns the node's current values in 'properties'."

    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]

      [turn.tool.parameters_schema.properties.id]
      type = "string"
      description = "Node ID to retrieve"
