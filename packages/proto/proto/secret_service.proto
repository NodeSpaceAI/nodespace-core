syntax = "proto3";

package nodespace;

// SecretService manages the device's credential store: the values that a remote
// tool's `keychain:<name>` reference points at. It is process-global (not routed
// by database): the store belongs to the device, not to one database.
//
// A value travels only in a Set request. No response, list or error carries a
// value: ListNames returns names only.
service SecretService {
  // Store a value under a name, replacing any earlier value.
  rpc Set(SetSecretRequest) returns (SetSecretResponse);
  // Remove a name and its value. Removing an unset name succeeds.
  rpc Delete(DeleteSecretRequest) returns (DeleteSecretResponse);
  // List the names that have a value on this device, sorted.
  rpc ListNames(ListSecretNamesRequest) returns (ListSecretNamesResponse);
}

message SetSecretRequest {
  string name = 1;
  // The credential value. Never logged: `Debug` of this message prints a
  // placeholder in its place.
  string value = 2;
}

message SetSecretResponse {}

message DeleteSecretRequest {
  string name = 1;
}

message DeleteSecretResponse {
  // Whether a value was stored under the name.
  bool existed = 1;
}

message ListSecretNamesRequest {}

message ListSecretNamesResponse {
  repeated string names = 1;
}
