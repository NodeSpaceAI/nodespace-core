syntax = "proto3";

package nodespace;

// LocalAgentService manages the local llama.cpp ReAct loop agent.
//
// A session wraps a conversation with the local LLM inference engine.
// Clients can start sessions, send messages (receiving token stream responses),
// query agent/model status, manage models, and cancel in-progress generation.
service LocalAgentService {
  // Node-driven chat: subscribe once to receive all token-stream events from
  // any ai-chat node inference turn. Replaces per-message SendMessage/StartSession
  // IPC — the daemon now drives inference in response to NodeUpdated events.
  rpc SubscribeTokenStream(SubscribeTokenStreamRequest) returns (stream AgentChunk);
  // Cancel an in-progress inference turn for a given node.
  rpc CancelTurn(CancelTurnRequest)              returns (CancelTurnResponse);
  // Create the chat a play is edited through: a native chat that pins the
  // play-authoring skill and the play, opened by a message the system writes.
  rpc CreatePlayEditChat(CreatePlayEditChatRequest) returns (CreatePlayEditChatResponse);
  rpc GetStatus(GetLocalStatusRequest)           returns (LocalAgentStatusResponse);
  rpc EnsureModelReady(EnsureModelReadyRequest)  returns (stream ModelLoadProgressEvent);
  rpc ListModels(ListModelsRequest)              returns (ListModelsResponse);
  rpc DownloadModel(DownloadModelRequest)        returns (stream ModelLoadProgressEvent);
  rpc DeleteModel(DeleteModelRequest)            returns (DeleteModelResponse);
  rpc LoadModel(LoadModelRequest)                returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest)            returns (UnloadModelResponse);
  rpc CancelModelDownload(CancelModelDownloadRequest) returns (CancelModelDownloadResponse);
  rpc RecommendedModel(RecommendedModelRequest)  returns (RecommendedModelResponse);
  rpc GetSystemRam(GetSystemRamRequest)          returns (GetSystemRamResponse);
}

// ---------------------------------------------------------------------------
// SubscribeTokenStream — long-lived server-streaming token delivery
// ---------------------------------------------------------------------------

// Subscribe to all inference token events from the daemon.
// The Tauri process opens one subscription on startup; the daemon pushes
// AgentChunk events for every ai-chat node turn as they happen.
message SubscribeTokenStreamRequest {}

// AgentChunk is one event in a streaming agent response.
//
// The chunk_type field determines which optional field is populated:
//   "token"           — delta text token
//   "tool_call_start" — the agent is beginning a tool call
//   "tool_call_args"  — incremental JSON args for a tool call in progress
//   "done"            — generation complete (usage populated)
//   "error"           — an error occurred during streaming
message AgentChunk {
  string chunk_type = 1;

  // Populated for chunk_type == "token"
  optional string token_text = 2;

  // Populated for chunk_type == "tool_call_start" and "tool_call_args"
  optional string tool_call_id = 3;
  optional string tool_name = 4;
  optional string tool_args_json = 5;

  // Populated for chunk_type == "done"
  optional int32 prompt_tokens = 6;
  optional int32 completion_tokens = 7;

  // Populated for chunk_type == "error"
  optional string error_message = 8;

  // The ai-chat node this chunk belongs to (populated on all chunks).
  optional string node_id = 9;
}

// ---------------------------------------------------------------------------
// GetStatus
// ---------------------------------------------------------------------------

message GetLocalStatusRequest {
  // If set, return status for a specific session; otherwise returns global status.
  optional string session_id = 1;
}

message LocalAgentStatusResponse {
  // Serialized LocalAgentStatus (JSON): "idle" | {"status":"streaming"} | etc.
  // Using JSON string keeps the proto stable as the Rust enum evolves.
  string status_json = 1;
  // Id of the chat model currently loaded; empty when none is.
  string model_id = 2;
  // Context window the engine actually granted the loaded model. It is sized
  // to available memory at load time and can be well below the configured
  // ceiling. 0 when no model is loaded.
  //
  // Reported so a caller can verify the window exceeds the system prompt it
  // intends to send. Without it an over-large prompt fails per turn at
  // generation time, which reads as the model declining to act rather than as
  // an environment that cannot run the request at all.
  uint32 granted_n_ctx = 3;
}

// ---------------------------------------------------------------------------
// CancelTurn
// ---------------------------------------------------------------------------

message CancelTurnRequest {
  // The ai-chat node whose in-progress turn should be cancelled.
  string node_id = 1;
}

message CancelTurnResponse {}

// ---------------------------------------------------------------------------
// CreatePlayEditChat
// ---------------------------------------------------------------------------

message CreatePlayEditChatRequest {
  // The play the chat edits.
  string play_id = 1;
  // The model the chat starts on, when the client has a default: where
  // inference runs (`native`, `openai-compat`) and the model's id.
  optional string provider = 2;
  optional string model = 3;
}

message CreatePlayEditChatResponse {
  // The new ai-chat-native node.
  string chat_id = 1;
}

// ---------------------------------------------------------------------------
// EnsureModelReady — server-streaming model load/download progress
// ---------------------------------------------------------------------------

message EnsureModelReadyRequest {
  string model_id = 1;
}

// ModelLoadProgressEvent streams phase transitions during model loading.
//
// event_type values:
//   "downloading"  — model file is being downloaded (bytes fields populated)
//   "verifying"    — model file integrity is being checked (SHA-256); only
//                    emitted when this is a cache miss and a full hash is
//                    actually about to run, since a cache hit finishes before
//                    there is anything worth reporting progress on
//   "loading"      — model is being loaded into memory
//   "ready"        — model is loaded and the engine is ready
//   "error"        — an error occurred (error_message populated)
//   "engine_swapped" — engine was replaced (existing sessions were dropped)
message ModelLoadProgressEvent {
  string event_type = 1;
  string model_id = 2;
  optional string message = 3;

  // Populated for event_type == "downloading"
  optional int64 bytes_downloaded = 4;
  optional int64 bytes_total = 5;

  // Populated for event_type == "error"
  optional string error_message = 6;

  // Populated for event_type == "engine_swapped": true if the inference
  // engine was replaced (active sessions were dropped).
  optional bool engine_swapped = 7;
}

// ---------------------------------------------------------------------------
// ListModels
// ---------------------------------------------------------------------------

message ListModelsRequest {
  // Bypass the daemon's short-TTL discovery cache and re-query every
  // configured OpenAI-compatible endpoint immediately. Set by the
  // explicit "Refresh remote models" action in Settings; every other
  // call site leaves this false and accepts a cache hit.
  bool force_refresh = 1;
}

message ModelEntry {
  string id = 1;
  string name = 2;
  // "gguf" | "openai-compat"
  string backend = 3;
  // Serialized ModelStatus (JSON tag-enum): "not_downloaded" | "ready" | etc.
  string status_json = 4;
  int64 size_bytes = 5;
  string quantization = 6;
  // Minimum system RAM (GiB) required; 0 means unknown.
  uint32 min_memory_gb = 7;
}

message ListModelsResponse {
  repeated ModelEntry models = 1;
}

// ---------------------------------------------------------------------------
// DownloadModel — server-streaming download progress
// ---------------------------------------------------------------------------

message DownloadModelRequest {
  string model_id = 1;
}

// ---------------------------------------------------------------------------
// DeleteModel
// ---------------------------------------------------------------------------

message DeleteModelRequest {
  string model_id = 1;
}

message DeleteModelResponse {}

// ---------------------------------------------------------------------------
// LoadModel
// ---------------------------------------------------------------------------

message LoadModelRequest {
  string model_id = 1;
}

message LoadModelResponse {}

// ---------------------------------------------------------------------------
// UnloadModel
// ---------------------------------------------------------------------------

message UnloadModelRequest {}

message UnloadModelResponse {}

// ---------------------------------------------------------------------------
// CancelModelDownload
// ---------------------------------------------------------------------------

message CancelModelDownloadRequest {
  string model_id = 1;
}

message CancelModelDownloadResponse {}

// ---------------------------------------------------------------------------
// RecommendedModel
// ---------------------------------------------------------------------------

message RecommendedModelRequest {}

message RecommendedModelResponse {
  string model_id = 1;
}

// ---------------------------------------------------------------------------
// GetSystemRam
// ---------------------------------------------------------------------------

message GetSystemRamRequest {}

message GetSystemRamResponse {
  // Total system RAM in bytes.
  uint64 ram_bytes = 1;
}
