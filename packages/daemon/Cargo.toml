[package]
name = "nodespace-daemon"
version.workspace = true
description = "gRPC daemon for NodeSpace services — compiled proto types and service definitions"
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nodespaced"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
nodespace-proto = { workspace = true }
nodespace-types = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tokio-stream = "0.1"
async-stream = "0.3"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
ulid = "1"
uuid = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
nodespace-core = { workspace = true }
# Overwrites the credential value of a Set request once it is stored.
zeroize = "1"
nodespace-agent = { workspace = true }
nodespace-nlp-engine = { workspace = true }

# System tray (ADR-031): the daemon owns the tray icon, not the Tauri app.
# tray-icon ships an event loop via `tao`; we run it on the main thread on
# macOS (NSApplication requirement) and the gRPC server inside a dedicated
# tokio runtime on a worker thread.
tray-icon = "0.21"
tao = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
dirs = "5.0"
libc = "0.2"

# Reading the daemon's own process RSS for `nodespace diagnostics`. Only a
# process can portably read its own memory footprint, so this has to live in
# the daemon rather than in the CLI that renders the figure.
sysinfo = "0.33"

# Asking the user at the screen (LocalAuthentication: Touch ID, a paired
# Watch or the login password in a system panel) before a remote tool is
# approved or a credential is changed. The objc2 versions are the ones the
# lockfile already holds through tao and tray-icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"
# Checking a connecting program's code signature (SecCode) against the team requirement.
security-framework = "3.7"
core-foundation = "0.10"

# Named Pipe owner-only DACL construction (ADR-052 -- the Windows equivalent
# of `bind_uds_owner_only`'s 0o600 on Unix). Version pinned to match the one
# `tokio` itself already resolves to (see `tokio`'s own Cargo.toml), so this
# doesn't pull in a second copy.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.0"
# Building a database file of another release's shape from its DDL, and
# hashing it to show a refused open left it untouched.
libsql = { workspace = true }
sha2 = "0.10"
# Integration tests need PtySession::launch_for_test to spawn shell utilities
# (echo, cat) without a real agent binary. The `testing` feature exposes that
# helper as part of the agent crate's public surface.
nodespace-agent = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream = "0.1"
tonic = "0.12"
