name: Verify macOS .pkg installer (Gatekeeper)

# Re-checks the CURRENTLY PUBLISHED .pkg release asset against live
# Gatekeeper on a freshly-provisioned runner -- independent of, and any
# amount of time after, the release build that produced it.
#
# Why this exists: release.yml's build-pkg-macos job already runs
# `spctl --assess --type install` against the .pkg it just built, but only
# on the SAME runner, seconds after notarization -- that
# proves the file passed Gatekeeper *once, immediately*, not that it will
# still pass for a real user's download days or weeks later. v0.3.0's
# published .pkg passed that build-time check and was still correctly
# signed, notarized (Apple notary service: Accepted), and stapled when a
# real end-user install attempt hit a hard Gatekeeper rejection days after
# release. A .pkg's outer container must itself pass a live "type install"
# assessment before an install can proceed -- unlike a .dmg, where
# Gatekeeper only ever assesses the contained .app -- so .pkg is uniquely
# exposed to this class of after-the-fact drift that a same-runner,
# moments-after-build check cannot observe.
#
# This workflow re-runs that exact assessment daily, on a fresh runner (not
# the one that built the release), against whatever is CURRENTLY live on
# the release page, so a regression is caught automatically within a day
# instead of via the next real user's failed install.

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "40 7 * * *" # once daily, off-peak UTC
  workflow_dispatch: {}

# Serializes overlapping runs (the daily schedule landing near a manual
# workflow_dispatch, or two dispatches close together) so the issue-dedup
# lookup in the failure step never races two runs into both seeing "no
# existing issue" and both filing a duplicate. Never cancel a run already
# checking Gatekeeper -- let it finish and report before the next starts.
concurrency:
  group: verify-macos-installer
  cancel-in-progress: false

jobs:
  verify-pkg-gatekeeper:
    name: bun run pkg:verify-gatekeeper
    runs-on: macos-latest
    # 20 (not the original 10): the unconditional install step below
    # (retried once on failure) can itself eat several minutes on a cold
    # runner or a slow registry. A cancelled (timed-out) job does NOT run
    # its `if: failure()` steps -- only a *failed* step does -- so a job
    # timeout that leaves no headroom past the install would silently
    # defeat this workflow's loud-failure-reporting guarantee (no tracking
    # issue filed) instead of triggering it.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # Unconditional (not gated on failure): the tracking-issue dedup
      # helper (bun run gh:tracking-issue, below) needs node_modules
      # (@octokit/rest) and only runs in the failure path -- if this were
      # also `if: failure()`, a broken install would fail silently right
      # when the workflow most needs to report loud, since the failure
      # step would itself then fail with no tracking issue filed. Running
      # it here instead means a broken install shows up as an ordinary red
      # step on every run, not just a meta-failure hidden inside the one
      # case this workflow exists to catch.
      #
      # Retried once: a genuinely persistent install failure still leaves
      # the failure step unable to file a tracking issue (an accepted
      # residual gap -- routing around it with a `gh`-CLI fallback here
      # would reintroduce the class of hand-rolled dedup logic this whole
      # change exists to eliminate), but a transient one (the likelier
      # real-world trigger: a registry blip, not an outage) gets a second
      # attempt instead of taking down issue reporting over a flake.
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install --frozen-lockfile

      - name: Re-assess the published .pkg against live Gatekeeper
        id: verify
        # tee'd to a file so the failure step can quote the actual spctl
        # output -- a genuine Gatekeeper rejection and "the check itself
        # couldn't run" (network/gh/auth) both fail loud, but an operator
        # triaging the auto-filed issue needs to tell them apart from the
        # message alone (same reasoning as homebrew-drift-check.yml).
        # `shell: bash` is required for the pipe -- with no `shell:` key
        # Actions runs `bash -e {0}` without pipefail, so tee's exit code
        # would win and a real rejection would report GREEN.
        shell: bash
        run: bun run pkg:verify-gatekeeper 2>&1 | tee gatekeeper-output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open (or update) an issue on failure (loud, with the actual message)
        if: failure()
        # Dedup (find an open issue with this exact title, comment on it
        # instead of filing a duplicate) is handled by the shared
        # `findOrCreateTrackingIssue` helper in scripts/gh-utils.ts (`bun run
        # gh:tracking-issue`), not hand-rolled here. An earlier version of
        # this step shelled out to `gh issue list --jq --arg ...` piped into
        # `jq` -- `gh`'s own `--jq` doesn't support `--arg` at all, so that
        # invocation errored out before the dedup/create logic ever ran,
        # silently skipping the exact failure this workflow exists to
        # report. The TypeScript helper goes through Octokit directly, so
        # that whole class of shell/`gh`-CLI argument-parsing bug can't
        # recur, and it has unit tests (scripts/gh-utils.test.ts) covering
        # the title-matching/dedup logic the way this inline script never
        # was.
        #
        # The helper matches via the regular strongly-consistent
        # issues-list endpoint, never GitHub's `--search`/search-index
        # endpoint -- that index is only eventually consistent, and an
        # earlier version of this step's own dedup logic (before it used
        # this helper) could still have raced it: a workflow_dispatch
        # re-run shortly after filing the tracking issue (e.g. someone
        # re-running to confirm a fix, or two runs landing close together
        # around the cron boundary) could see no match and file a
        # duplicate. See findOrCreateTrackingIssue's own doc comment for
        # the full reasoning.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "The scheduled macOS .pkg Gatekeeper check failed against the currently-published release. Run: ${RUN_URL}"
            echo
            echo "Output:"
            echo '```'
            cat gatekeeper-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "If the output above starts with \"GATEKEEPER REJECTED\", a real user's install of the"
            echo "current .pkg release asset will fail the same way -- treat as release-blocking."
            echo "Any other message means the check itself failed to run (network/gh/auth) -- not necessarily a rejection; check the run log."
          } > issue-body.txt

          bun run gh:tracking-issue \
            --title "macOS .pkg installer fails live Gatekeeper assessment" \
            --body-file issue-body.txt \
            --labels "bug,foundation"
