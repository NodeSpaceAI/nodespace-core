name: Release

on:
  release:
    # `published`, NOT `created`. GitHub defines `created` as "a draft was
    # saved, or a release or pre-release was published without previously
    # being saved as a draft", and Actions additionally never runs workflows
    # for the `created` activity type on draft releases. The combination
    # means a release that is saved as a draft first and published later
    # NEVER fires `created` -- not on the draft save (suppressed), and not on
    # the publish (already "created"). Publishing such a draft silently built
    # nothing at all: no run, no error, just a release with no binaries and
    # no Homebrew/install.sh update behind it.
    #
    # `published` fires on both paths -- publishing an existing draft, and
    # creating a release non-draft in one shot -- so it covers the draft
    # review flow without losing the direct `gh release create` flow.
    #
    # Deliberately a single activity type. Release activity types overlap
    # rather than partition: one non-draft `gh release create` emits
    # `created` AND `published` (and `released`/`prereleased`), so listing
    # two of them would start two concurrent runs for one release -- both
    # uploading the same assets with --clobber and both racing to push the
    # Homebrew tap, which is exactly the non-fast-forward hazard
    # sync-homebrew-formula's `needs` ordering exists to prevent. Do not add
    # `created` or `prereleased` alongside this; `published` already covers
    # stable and pre-releases alike.
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm
          - macos-pkg
          - linux-arm
          - linux-x86
          - windows-x86

# Required permissions for uploading release assets and creating failure issues
permissions:
  contents: write
  issues: write

jobs:
  # macOS ARM is a standalone job so downstream sync jobs (sync-homebrew-cask,
  # sync-skill-repo) can depend on it alone, without being blocked by the
  # Windows leg. (An earlier publish-npm job used to be the reason this was
  # split out; it was removed before ever running -- npm publishing was
  # dropped as a distribution path in favor of the public
  # NodeSpaceAI/nodespace-skill repo sync-skill-repo pushes to, so there is no
  # publish-npm job to depend on it anymore. The split itself stayed useful
  # for the reason above and was kept.)
  build-tauri-macos-arm:
    name: Build Tauri (macOS ARM)
    runs-on: macos-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./packages/desktop-app/src-tauri -> target
            . -> target

      - name: Install Protobuf
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install protobuf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit types
        run: bun run --cwd packages/desktop-app sync

      - name: Download embedding model for bundling
        run: |
          mkdir -p packages/desktop-app/src-tauri/resources/models
          gh release download models-v2 --pattern "nomic-embed-text-v1.5.Q8_0.gguf" --dir packages/desktop-app/src-tauri/resources/models/
          echo "Model downloaded:"
          ls -la packages/desktop-app/src-tauri/resources/models/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nodespaced and nodespace sidecars
        run: |
          TRIPLE="aarch64-apple-darwin"
          BIN_DIR="packages/desktop-app/src-tauri/binaries"
          mkdir -p "${BIN_DIR}"

          echo "Building nodespaced for ${TRIPLE}..."
          cargo build --release --bin nodespaced --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespaced" "${BIN_DIR}/nodespaced-${TRIPLE}"
          chmod +x "${BIN_DIR}/nodespaced-${TRIPLE}"

          echo "Building nodespace CLI for ${TRIPLE}..."
          cargo build --release --bin nodespace --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespace" "${BIN_DIR}/nodespace-${TRIPLE}"
          chmod +x "${BIN_DIR}/nodespace-${TRIPLE}"

          echo "Sidecars built:"
          ls -la "${BIN_DIR}/"

      - name: Build and stage skill resources
        run: bun run build:skill

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Michael Libio (F4M5J7YNLS)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop-app
          tauriScript: bunx tauri
          args: '--target aarch64-apple-darwin'
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Upload artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-macos-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bundle/
          if-no-files-found: warn
          # Inspection-only (workflow_dispatch): a short window to download a build
          # for manual checking, not a deliverable.
          #
          # This is the SAME upload-artifact bare-directory round-trip that can
          # silently drop the Unix executable bit on Contents/MacOS/* binaries
          # (hardened below for the app-bundle-aarch64-apple-darwin handoff via
          # tar/untar). Deliberately left as a bare directory here and NOT given
          # the same tar/untar treatment: nothing in this workflow ever
          # download-artifacts + executes this one — it never reaches
          # build-pkg.sh, and a human who downloads it via the Actions UI is
          # inspecting file contents, not running the binaries, so a lost
          # executable bit here is a non-issue in practice. If that ever changes
          # (e.g. a future CI step starts executing binaries out of this
          # artifact), apply the same tar-before-upload/untar-after-download
          # pattern used for app-bundle-aarch64-apple-darwin below.
          retention-days: 7

      # Tar the bundle before handing it to upload-artifact: uploading/
      # downloading a bare directory through actions/upload-artifact is a
      # well-documented way to silently lose the Unix executable bit on files
      # inside it (this previously cost all four Contents/MacOS/* binaries
      # their +x bit on the round-trip into the build-pkg-macos job below,
      # breaking the installed app's ability to launch). A single tar file's
      # bytes round-trip through upload/download-artifact unchanged, since
      # there's no directory tree for that step to re-walk and re-zip
      # entry-by-entry — tar's own format already embeds the Unix permission
      # bits, so untarring after download restores them exactly. This fixes
      # the handoff at its source, for whatever downloads this artifact next,
      # not just build-pkg.sh's current one consumer.
      #
      # scripts/build-pkg.sh ALSO chmods these same binaries right before
      # packaging them, as an independent second line of defense — that line
      # is deliberate, not made redundant by this fix (see its own comment
      # for why both are kept). Because that chmod runs unconditionally after
      # this tar/untar handoff, on its own it would mask a regression here:
      # the "Verify tar/untar preserved the executable bit" step in the
      # downstream build-pkg-macos job below checks the untarred bundle
      # BEFORE build-pkg.sh runs, specifically to give CI a signal for a
      # regression in this mechanism rather than build-pkg.sh's.
      - name: Tar .app bundle (preserves executable bit through artifact round-trip)
        run: |
          # Fail fast here, in this cheap producing job, if the Tauri build
          # step above didn't actually produce bundle content. Before this
          # tar step existed, `upload-artifact`'s own `if-no-files-found:
          # error` (below) caught an empty bundle/macos directly. `tar -cf`
          # of an empty directory still produces a small but genuinely
          # non-empty tar file, so that same check on the tar file is
          # trivially satisfied regardless of whether the bundle itself was
          # empty — silently moving this failure mode one job downstream,
          # to the "Verify tar/untar preserved the executable bit" step in
          # build-pkg-macos, after that job has already spun up a runner and
          # imported Apple certs into a keychain. Check for real content
          # explicitly, before tarring, to catch it at the original, cheap
          # point instead.
          #
          # `find -type f -print -quit` rather than `ls -A` on the top-level
          # directory: `ls -A` only sees whether bundle/macos/ has ANY entry,
          # so it would report "non-empty" and let a malformed
          # NodeSpace.app/ — present but containing zero actual files
          # anywhere inside it — through to the tar step undetected. Walking
          # the tree for a real file (and stopping at the first match, so
          # this stays cheap even though the bundle also carries the ~146MB
          # embedded model) is what the original bare-directory
          # `if-no-files-found: error` actually verified.
          if [[ -z "$(find target/aarch64-apple-darwin/release/bundle/macos -type f -print -quit 2>/dev/null)" ]]; then
            echo "::error::target/aarch64-apple-darwin/release/bundle/macos has no files — Tauri build did not produce bundle content"
            exit 1
          fi
          # COPYFILE_DISABLE=1 (the standard macOS/bsdtar idiom) stops tar
          # from writing a separate `._<filename>` AppleDouble sidecar entry
          # for any file that carries an extended attribute (a quarantine
          # flag, ACL, etc.) at archive time. Without it, such a file would
          # round-trip as two tar entries instead of one. A stray `._*` file
          # would NOT be caught by the Contents/MacOS/* executable-bit checks
          # elsewhere in this workflow — bash's bare `*` glob never matches
          # dot-prefixed names regardless of nullglob, with or without
          # dotglob set (which nothing here sets) — so build-pkg.sh's
          # unconditional `codesign` on the untarred bundle is the only
          # thing that would catch it, and it is documented to hard-reject a
          # bundle containing `._*` files outright, breaking the real signed
          # release build rather than giving a clear CI error.
          COPYFILE_DISABLE=1 tar -cf app-bundle.tar -C target/aarch64-apple-darwin/release/bundle/macos .

      - name: Upload .app bundle for pkg job
        uses: actions/upload-artifact@v7
        with:
          name: app-bundle-aarch64-apple-darwin
          path: app-bundle.tar
          if-no-files-found: error
          # Job-to-job handoff only — consumed by the pkg job (download-artifact)
          # within minutes of this run. Never a deliverable, so the minimum: 1 day.
          retention-days: 1

  build-tauri:
    name: Build Tauri (other platforms)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            rust_targets: 'x86_64-pc-windows-msvc'
            id: 'windows-x86'

    runs-on: ${{ matrix.platform }}

    steps:
      # Platform filter: skip early for unselected platforms (workflow_dispatch only)
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || [[ "${{ inputs.platform }}" == "all" ]] || [[ "${{ inputs.platform }}" == "${{ matrix.id }}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.id }} (selected: ${{ inputs.platform }})"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Install Rust stable
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        if: steps.filter.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./packages/desktop-app/src-tauri -> target
            . -> target

      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        if: steps.filter.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit types
        if: steps.filter.outputs.skip != 'true'
        run: bun run --cwd packages/desktop-app sync

      - name: Install Protobuf (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'windows-latest'
        run: choco install protoc --yes
        shell: bash

      # Mirrors the equivalent step in build-tauri-macos-arm above, including its
      # position before the sidecar build below: tauri.conf.json's `bundle.resources`
      # includes `resources/models/**/*` on every platform, but that directory is
      # gitignored (packages/desktop-app/src-tauri/resources/.gitignore) and not
      # committed, so a fresh runner checkout has it empty unless a step populates it
      # first. The macOS job has always done this; the Windows leg never did -- a glob
      # that matches zero files is not a tauri-bundler error, so the .msi/.exe silently
      # shipped without the embedding model with no build-time signal. Runs before the
      # sidecar build (rather than just before `Build Tauri app`) so a flaky ~146MB
      # download fails fast instead of only surfacing after paying for a full Rust build.
      - name: Download embedding model for bundling (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p packages/desktop-app/src-tauri/resources/models
          gh release download models-v2 --pattern "nomic-embed-text-v1.5.Q8_0.gguf" --dir packages/desktop-app/src-tauri/resources/models/
          echo "Model downloaded:"
          ls -la packages/desktop-app/src-tauri/resources/models/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nodespaced and nodespace sidecars (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          TRIPLE="${{ matrix.rust_targets }}"
          BIN_DIR="packages/desktop-app/src-tauri/binaries"
          mkdir -p "${BIN_DIR}"

          echo "Building nodespaced for ${TRIPLE}..."
          cargo build --release --bin nodespaced --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespaced.exe" "${BIN_DIR}/nodespaced-${TRIPLE}.exe"

          echo "Building nodespace CLI stub for ${TRIPLE}..."
          cargo build --release --bin nodespace --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespace.exe" "${BIN_DIR}/nodespace-${TRIPLE}.exe"

          echo "Sidecars built:"
          ls -la "${BIN_DIR}/"

      - name: Build and stage skill resources
        if: steps.filter.outputs.skip != 'true'
        run: bun run build:skill

      - name: Build Tauri app
        if: steps.filter.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS minimum version — must be 14.0+ for Metal GPU embeddings (ggml)
          # 10.15 caused ggml_mul_mat assertion failures in build_pooling (#990)
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          # Apple code signing and notarization (macOS only)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Michael Libio (F4M5J7YNLS)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop-app
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          # Only set releaseId when triggered by release event (undefined for workflow_dispatch)
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Upload artifacts (workflow_dispatch only)
        if: steps.filter.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.rust_targets || 'default' }}
          path: |
            target/${{ matrix.rust_targets || '' }}/release/bundle/
            target/release/bundle/
          if-no-files-found: warn
          # Inspection-only (workflow_dispatch): short window for manual download.
          retention-days: 7

  build-pkg-macos:
    name: Build macOS .pkg installer (ARM)
    runs-on: macos-latest
    needs: build-tauri-macos-arm
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'all' || inputs.platform == 'macos-pkg'))

    env:
      TRIPLE: aarch64-apple-darwin
      APPLE_SIGNING_IDENTITY: "Developer ID Application: Michael Libio (F4M5J7YNLS)"
      APPLE_INSTALLER_IDENTITY: "Developer ID Installer: Michael Libio (F4M5J7YNLS)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "${APPLE_CERTIFICATE}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          echo "${APPLE_INSTALLER_CERTIFICATE}" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_INSTALLER_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/productbuild

          security list-keychains -d user -s "${KEYCHAIN_PATH}" "$(security list-keychains -d user | xargs)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Download .app bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: app-bundle-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bundle/macos/

      # Untar the bundle back into place — the mirror of "Tar .app bundle" in
      # the upstream Tauri job. Restores the Unix executable bit exactly as
      # it was before the artifact round-trip, since it was preserved inside
      # the tar file's own format rather than relying on upload/
      # download-artifact to carry it.
      - name: Untar .app bundle (restores executable bit)
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos/
          # COPYFILE_DISABLE=1 matches the "Tar .app bundle" step's flag —
          # see its comment. Setting it here too covers extraction of an
          # AppleDouble entry that made it into an archive some other way
          # (this same idiom is applied symmetrically on both sides of every
          # macOS tar round-trip, not just the write side).
          #
          # -p (--preserve-permissions): without it, bsdtar's default
          # extraction behavior for a non-root user applies the process
          # umask to the archived mode bits rather than restoring them
          # exactly (confirmed empirically: extracting a 755 file under
          # umask 027 without -p produces 750, silently dropping the
          # world-execute bit; -p reproduces 755 regardless of umask). The
          # runner's actual default umask (022) happens not to strip
          # rwxr-xr-x today, which is exactly the kind of unstated
          # assumption this whole PR exists to stop relying on for
          # executable-bit correctness. -p makes the "restores them exactly"
          # claim in this job's other comments true unconditionally.
          COPYFILE_DISABLE=1 tar -xpf app-bundle.tar
          rm app-bundle.tar

      # Checks the tar/untar round-trip in isolation, before build-pkg.sh
      # runs. build-pkg.sh has its own unconditional chmod on these same
      # files as a second line of defense (see its comment) — valuable for
      # the final installed package, but it means a check placed AFTER
      # build-pkg.sh (the "Install .pkg and verify it actually lands
      # correctly" step's verify_layout below) would stay green even if the
      # tar/untar handoff above silently regressed back to losing the
      # executable bit; build-pkg.sh's chmod would quietly paper over it.
      # This step is what actually isolates a regression in the tar/untar
      # mechanism specifically, by checking before that chmod has run.
      - name: Verify tar/untar preserved the executable bit
        run: |
          shopt -s nullglob
          macos_bins=(target/aarch64-apple-darwin/release/bundle/macos/NodeSpace.app/Contents/MacOS/*)
          shopt -u nullglob
          if [[ ${#macos_bins[@]} -eq 0 ]]; then
            echo "::error::NodeSpace.app/Contents/MacOS has no files after untar"
            exit 1
          fi
          for bin in "${macos_bins[@]}"; do
            # -f guard before -x: `test -x` alone is true for a directory the
            # owner can traverse (execute = search permission for
            # directories), not just an executable regular file. Not
            # reachable with today's flat Contents/MacOS/ binary layout, but
            # without this guard a future subdirectory placed there would
            # silently pass this check without ever containing a verified
            # executable.
            test -f "${bin}" || { echo "::error::${bin} is not a regular file"; exit 1; }
            test -x "${bin}" || { echo "::error::${bin} lost its executable bit across the tar/untar artifact round-trip"; exit 1; }
          done
          echo "    All Contents/MacOS/* binaries are executable after the tar/untar round-trip"

      - name: Build nodespaced and nodespace binaries
        run: |
          # Build the headless binaries that go into /usr/local/bin/ in the .pkg.
          # The .app bundle is reused from the upstream Tauri job (downloaded above).
          cargo build --release \
            --bin nodespaced --bin nodespace \
            --target aarch64-apple-darwin

      - name: Build .pkg installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-pkg.sh

      - name: Install .pkg and verify it actually lands correctly
        shell: bash
        run: |
          PKG=$(ls target/pkg-output/*.pkg | head -1)
          echo "Installing: ${PKG}"

          verify_layout() {
            test -d /Applications/NodeSpace.app || { echo "::error::/Applications/NodeSpace.app is missing after install"; exit 1; }
            test -x /usr/local/bin/nodespace || { echo "::error::/usr/local/bin/nodespace is missing or not executable"; exit 1; }
            test -x /usr/local/bin/nodespaced || { echo "::error::/usr/local/bin/nodespaced is missing or not executable"; exit 1; }

            # The app bundle's own executables need the same check: a lost
            # Unix executable bit anywhere in the artifact handoff between
            # the build jobs (or a regression in build-pkg.sh's payload
            # assembly) previously produced an installed .app that passed
            # every check above yet still could not launch, with nothing in
            # this step to catch it. shopt/nullglob first so an empty
            # Contents/MacOS (unexpected, but not otherwise diagnosed) fails
            # with a clear message instead of a confusing literal-asterisk
            # path from an unmatched glob.
            shopt -s nullglob
            local macos_bins=(/Applications/NodeSpace.app/Contents/MacOS/*)
            shopt -u nullglob
            if [[ ${#macos_bins[@]} -eq 0 ]]; then
              echo "::error::/Applications/NodeSpace.app/Contents/MacOS has no files"
              exit 1
            fi
            for bin in "${macos_bins[@]}"; do
              # -f guard before -x, matching the "Verify tar/untar preserved
              # the executable bit" step's reasoning: `test -x` alone is
              # true for a traversable directory too, not just an
              # executable regular file.
              test -f "${bin}" || { echo "::error::${bin} is not a regular file"; exit 1; }
              test -x "${bin}" || { echo "::error::${bin} is missing or not executable"; exit 1; }
            done

            echo "    /Applications/NodeSpace.app (incl. all Contents/MacOS/* executables), nodespace, nodespaced all present"
          }

          # Install once against a clean runner (the common case), then install
          # the SAME package again immediately. The second run is what actually
          # exercises the failure this check exists to catch: postinstall's
          # launchd bootstrap now runs against an already-registered daemon
          # label, the exact condition that previously made `installer` report
          # the whole package as failed even though the binaries were already
          # in place.
          echo "==> First install"
          sudo installer -pkg "${PKG}" -target / -verbose
          verify_layout

          echo "==> Second install (daemon already registered from the first install)"
          sudo installer -pkg "${PKG}" -target / -verbose
          verify_layout

          # Bundle relocation itself needs a Spotlight/LaunchServices-known
          # decoy bundle elsewhere on disk to trigger — unreliable to fake
          # deterministically on an ephemeral runner within a CI-sized time
          # budget. What we CAN check on every run is that the built package
          # actually disables per-bundle relocation search in the first
          # place, so a regression that drops --component-plist (or flips
          # the flag back) fails here.
          #
          # PackageInfo's top-level <pkg-info relocatable="..."> attribute is
          # a DIFFERENT, unrelated setting (whether the whole .pkg can be
          # installed to an alternate root) — it reads relocatable="false" on
          # every build regardless of BundleIsRelocatable, so grepping for
          # that string proves nothing. The real signal is the <relocate>
          # element: it lists <bundle id="com.nodespace.desktop"/> when
          # relocation search is enabled, and is empty when
          # BundleIsRelocatable=false disables it — confirmed locally by
          # building the component three ways (no --component-plist,
          # BundleIsRelocatable=true, BundleIsRelocatable=false) and
          # inspecting each PackageInfo.
          echo "==> Confirming the component package disables bundle-relocation search"
          rm -rf "${RUNNER_TEMP}/pkg-expanded"
          pkgutil --expand target/pkg-build/NodeSpace-component.pkg "${RUNNER_TEMP}/pkg-expanded"
          python3 - "${RUNNER_TEMP}/pkg-expanded/PackageInfo" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          relocate = root.find("relocate")
          if relocate is None:
              print("::error::PackageInfo has no <relocate> element at all -- unexpected pkgbuild output")
              sys.exit(1)

          offending = [b.get("id") for b in relocate.findall("bundle") if b.get("id") == "com.nodespace.desktop"]
          if offending:
              print("::error::<relocate> still lists com.nodespace.desktop as a relocation-search candidate "
                    "-- BundleIsRelocatable=false regressed (component.plist missing/wrong, or "
                    "--component-plist dropped from pkgbuild)")
              sys.exit(1)

          print("    <relocate> has no com.nodespace.desktop entry -- bundle-relocation search is disabled")
          PYEOF

      - name: Upload .pkg to release
        if: github.event_name == 'release'
        run: |
          PKG=$(ls target/pkg-output/*.pkg | head -1)
          gh release upload ${{ github.event.release.tag_name }} "${PKG}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .pkg as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-pkg
          path: target/pkg-output/*.pkg
          if-no-files-found: warn
          # Inspection-only (workflow_dispatch): the distribution path for a real
          # release is the Release asset (gh release upload above), so the artifact
          # copy is redundant there — keep it short.
          retention-days: 7

  build-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            id: macos-arm
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            id: linux-arm
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            id: linux-x86

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            id: windows-x86

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || [[ "${{ inputs.platform }}" == "all" ]] || [[ "${{ inputs.platform }}" == "${{ matrix.id }}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.id }} (selected: ${{ inputs.platform }})"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Install Rust stable
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: steps.filter.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Bun is needed to compile the standalone `nodespace-skill-installer`
      # sidecar below (`bun build --compile`) -- this job otherwise builds
      # pure Rust. Skipped on Windows: the CLI itself isn't built there
      # (Unix-socket-only transport), so there's no `nodespace` binary for
      # the sidecar to sit beside.
      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true' && matrix.os != 'windows-latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies (for the skill installer compile)
        if: steps.filter.outputs.skip != 'true' && matrix.os != 'windows-latest'
        run: bun install --frozen-lockfile

      - name: Install Protobuf (macOS)
        if: steps.filter.outputs.skip != 'true' && matrix.os == 'macos-latest'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install protobuf

      - name: Install Protobuf (Linux)
        if: steps.filter.outputs.skip != 'true' && matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libgtk-3-dev libxdo-dev

      - name: Install Protobuf (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.os == 'windows-latest'
        run: choco install protoc --yes
        shell: bash

      - name: Install cross-compilation toolchain (Linux ARM)
        if: steps.filter.outputs.skip != 'true' && matrix.id == 'linux-arm'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libxml2:arm64
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libgtk-3-dev:arm64 libxdo-dev:arm64 libssl-dev:arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build nodespaced
        if: steps.filter.outputs.skip != 'true'
        run: cargo build --release --bin nodespaced --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-g++' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.id == 'linux-arm' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.id == 'linux-arm' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.id == 'linux-arm' && '/' || '' }}

      - name: Build nodespace CLI
        if: steps.filter.outputs.skip != 'true' && matrix.os != 'windows-latest'
        run: cargo build --release --bin nodespace --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-g++' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.id == 'linux-arm' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.id == 'linux-arm' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.id == 'linux-arm' && '/' || '' }}

      - name: Rename binaries with target triple suffix
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/nodespaced${EXT}" "nodespaced-${{ matrix.target }}${EXT}"
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/nodespace" "nodespace-${{ matrix.target }}"
          fi

      # Compiles the same standalone `nodespace-skill-installer` sidecar the
      # Tauri desktop app bundles (see `scripts/build-skill.ts`), but for
      # this job's headless targets instead of `build-skill.ts`'s
      # macOS/Windows-only `hostTriple()` -- a CLI-only install (this
      # matrix's whole purpose) has no Tauri app and needs its own copy.
      # `nodespace skill install` (packages/cli/src/commands/skill.rs)
      # resolves this sidecar by looking beside its own executable, so it
      # is named and placed exactly like `nodespace`/`nodespaced` above.
      #
      # `bun build --compile` cross-compiles across OS but not always
      # cleanly across libc/arch on the runner it's invoked from, so this
      # compiles natively on each matrix leg's own runner, same as the Rust
      # binaries above -- no `--target` cross-compile flag needed since
      # each leg already runs on a machine of its own target OS/arch.
      - name: Compile skill installer sidecar
        if: steps.filter.outputs.skip != 'true' && matrix.os != 'windows-latest'
        run: |
          bun build --compile packages/skill/src/install.ts \
            --outfile "nodespace-skill-installer-${{ matrix.target }}"
          chmod +x "nodespace-skill-installer-${{ matrix.target }}"

      # The sidecar reads SKILL.md/shims/references from --resource-root at
      # runtime (see install.ts/installer.ts) rather than bundling them --
      # same split as the Tauri build. Packaged as one tarball per target so
      # install.sh/the CLI can fetch and unpack a single release asset
      # instead of one per file.
      - name: Package skill installer resources
        if: steps.filter.outputs.skip != 'true' && matrix.os != 'windows-latest'
        shell: bash
        run: |
          bun run --cwd packages/skill build
          tar -czf "nodespace-skill-installer-resources-${{ matrix.target }}.tar.gz" \
            -C packages/skill dist shims SKILL.md references package.json

      - name: Upload binaries to release
        if: steps.filter.outputs.skip != 'true' && github.event_name == 'release'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            gh release upload ${{ github.event.release.tag_name }} \
              "nodespaced-${{ matrix.target }}.exe" \
              --clobber
          else
            gh release upload ${{ github.event.release.tag_name }} \
              "nodespaced-${{ matrix.target }}" \
              "nodespace-${{ matrix.target }}" \
              "nodespace-skill-installer-${{ matrix.target }}" \
              "nodespace-skill-installer-resources-${{ matrix.target }}.tar.gz" \
              --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-homebrew-cask:
    name: Sync Homebrew tap cask
    runs-on: ubuntu-22.04
    needs: [build-tauri-macos-arm, build-tauri]
    # build-tauri only builds Windows now (the macOS Intel leg was removed --
    # Apple Silicon is the only supported macOS target). It stays in `needs`
    # purely for sequencing: this job waits for it to finish, success or
    # failure, before running -- but only build-tauri-macos-arm's result
    # gates execution below, since scripts/update-homebrew-cask.ts only
    # cares about the ARM .dmg, the one macOS artifact the cask ships. A
    # Windows build failure must not block the cask sync. The script hard-
    # fails (exit 1, feeding notify-failure below) if the release is
    # missing its Apple Silicon .dmg -- there's no other macOS
    # architecture left to fall back to.
    if: >-
      always() &&
      github.event_name == 'release' &&
      needs.build-tauri-macos-arm.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Update homebrew-nodespace cask
        run: bun run scripts/update-homebrew-cask.ts ${{ github.event.release.tag_name }} --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (or fine-grained token) with contents:write on
          # NodeSpaceAI/homebrew-nodespace -- secrets.GITHUB_TOKEN is scoped
          # to this repo only and cannot push cross-repo. Must be added as a
          # repo secret before this step can succeed; until then it fails
          # loudly here and notify-failure below opens an issue.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  sync-skill-repo:
    name: Publish NodeSpace skill to nodespace-skill
    runs-on: ubuntu-22.04
    # Unlike sync-homebrew-cask/sync-homebrew-formula, this job needs no
    # release asset -- scripts/publish-skill-repo.ts reads packages/skill/
    # SKILL.md and references/cli.md straight from the checked-out repo at
    # the release tag, so it doesn't wait on any build-* job and cannot be
    # blocked by one of them failing.
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Publish skill to nodespace-skill
        run: bun run scripts/publish-skill-repo.ts ${{ github.event.release.tag_name }} --push
        env:
          # PAT (or fine-grained token) with contents:write on
          # NodeSpaceAI/nodespace-skill -- secrets.GITHUB_TOKEN is scoped to
          # this repo only and cannot push cross-repo. Must be added as a
          # repo secret before this step can succeed; until then it fails
          # loudly here and notify-failure below opens an issue.
          SKILL_REPO_TOKEN: ${{ secrets.SKILL_REPO_TOKEN }}

  sync-install-script:
    name: Pin nodespace-website's install.sh to this release
    runs-on: ubuntu-22.04
    needs: build-headless
    # A sibling of sync-homebrew-cask above, same reasoning: install.sh
    # deliberately pins to a specific, confirmed-built release rather than
    # floating to "latest" (this repo's own `release: types: [published]`
    # trigger fires before build-headless's binaries even start building,
    # so "latest" can point at a release with no CLI assets yet). This job
    # is what advances the pin once those binaries are confirmed uploaded
    # -- without it, the pin would have to be hand-edited in
    # nodespace-website after every release, the same kind of drift the
    # Homebrew cask sync job above exists to prevent for the cask.
    #
    # Unlike sync-homebrew-cask, which can depend on one narrow upstream
    # job (build-tauri-macos-arm) for exactly the leg it needs,
    # build-headless is a single job with an internal 4-way matrix
    # (fail-fast: false), and GitHub Actions only exposes that job's
    # AGGREGATE result -- not individual matrix legs -- to `needs`. This
    # script's own required set (REQUIRED_HEADLESS_TARGETS in
    # publish-install-script.ts) is only 3 of those 4 legs, so gating on
    # `needs.build-headless.result == 'success'` would skip this job
    # entirely -- silently, with no signal in the resulting
    # "Release build failed" issue -- whenever an UNRELATED leg (e.g.
    # windows-x86, which install.sh never even downloads) flakes. Instead,
    # run whenever build-headless actually finished (not cancelled) and
    # let publish-install-script.ts's own checkReleaseAssets() be the real
    # gate: it re-verifies the specific assets this job needs via `gh
    # release view` and fails loudly (exit 1) if any are missing, which
    # correctly fails this job and feeds notify-failure with a real,
    # specific reason instead of a silent no-op.
    if: >-
      always() &&
      github.event_name == 'release' &&
      needs.build-headless.result != 'cancelled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Pin install.sh
        run: bun run scripts/publish-install-script.ts ${{ github.event.release.tag_name }} --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (or fine-grained token) with contents:write on
          # NodeSpaceAI/nodespace-website -- secrets.GITHUB_TOKEN is scoped
          # to this repo only and cannot push cross-repo. Must be added as
          # a repo secret before this step can succeed; until then it
          # fails loudly here and notify-failure below opens an issue.
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}

  sync-homebrew-formula:
    name: Sync Homebrew tap nodespace-cli formula
    runs-on: ubuntu-22.04
    needs: [build-headless, sync-homebrew-cask]
    # A sibling of sync-homebrew-cask above, for the nodespace-cli formula
    # rather than the nodespace cask (see update-homebrew-formula.ts's own
    # header for why it's a separate script, not a branch inside
    # update-homebrew-cask.ts). Gated the same way sync-install-script is,
    # for the identical reason: this script's required targets
    # (REQUIRED_HEADLESS_TARGETS in publish-install-script.ts, shared with
    # install.sh's own pin) are only 3 of build-headless's 4 matrix legs,
    # and `needs` only exposes that job's AGGREGATE result -- not
    # individual legs. Gating on `needs.build-headless.result == 'success'`
    # would skip this job entirely, silently, whenever an unrelated leg
    # (e.g. windows-x86, which this formula never ships) flakes. Instead,
    # run whenever build-headless actually finished (not cancelled) and let
    # update-homebrew-formula.ts's own resolveFormulaDigests() be the real
    # gate: unlike the cask (which can render an honest cask around a
    # missing optional architecture), every one of this formula's 3
    # targets is required, so it hard-fails (exit 1, feeding notify-failure
    # below) if any of its 6 assets is missing.
    #
    # sync-homebrew-cask is also in `needs` purely for SEQUENCING, the same
    # way build-tauri is in that job's own `needs` for sequencing without
    # gating on its result (see that job's comment): this job and
    # sync-homebrew-cask both push to homebrew-nodespace's main branch, and
    # before this job existed there was only ever one writer per release.
    # Running them concurrently would let either `git push` lose a
    # non-fast-forward race against the other with no retry (see
    # push-to-external-repo.ts) -- ordering this job after sync-homebrew-cask
    # finishes (success OR failure, hence `always()` below rather than
    # gating on its result) removes that race entirely: this job's own
    # fresh `git clone` always sees whatever sync-homebrew-cask already
    # pushed, if anything.
    if: >-
      always() &&
      github.event_name == 'release' &&
      needs.build-headless.result != 'cancelled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Update homebrew-nodespace nodespace-cli formula
        run: bun run scripts/update-homebrew-formula.ts ${{ github.event.release.tag_name }} --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same PAT sync-homebrew-cask uses above -- contents:write on
          # NodeSpaceAI/homebrew-nodespace, one repo secret shared by both
          # sync jobs. Until it's set, this fails loudly here and
          # notify-failure below opens an issue.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  notify-failure:
    name: Notify on build failure
    runs-on: ubuntu-22.04
    needs: [build-tauri-macos-arm, build-tauri, build-pkg-macos, build-headless, sync-homebrew-cask, sync-skill-repo, sync-install-script, sync-homebrew-formula]
    if: failure()

    steps:
      - name: Post GitHub issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Release build failed: ${TAG}" \
            --body "Release build failed. Tag: ${TAG}. Run: ${RUN_URL}. Triggered by: ${{ github.event_name }}. Check the run above for the failing job and logs." \
            --label "foundation"

  upload-checksums:
    needs: build-headless
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binaries from release
        run: |
          # Note: 'nodespace-*' matches only Unix CLI binaries — the Windows CLI
          # (nodespace-x86_64-pc-windows-msvc.exe) is intentionally not uploaded
          # because the Windows CLI is a stub (Unix socket transport only).
          gh release download ${{ github.event.release.tag_name }} \
            --pattern 'nodespaced-*' --pattern 'nodespace-*' \
            --dir artifacts/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum nodespaced-* nodespace-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to release
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
