name: install.sh drift check

# Independent backstop for the install.sh version pin, mirroring
# homebrew-drift-check.yml. Two things can leave `curl -fsSL
# https://nodespace.ai/install.sh | sh` installing an old CLI, and this
# checks both: the pin in NodeSpaceAI/nodespace-website's main branch
# (advanced by release.yml's sync-install-script job) and the file the live
# site actually serves (deployed by the website's hosting, outside this
# repo). The failure message says which one drifted.
#
# Known, accepted: a run landing within minutes of a release publish can
# report drift while the sync job / site deploy is still in flight; the
# tracking issue is deduped and the next daily run clears it.

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 14 * * *" # once daily
  workflow_dispatch: {}

jobs:
  drift-check:
    name: bun run install-script:drift-check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    concurrency:
      group: install-script-drift-check
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install --frozen-lockfile

      - name: Check install.sh pin against latest release
        # `shell: bash` for pipefail, so the tee does not mask the exit code.
        shell: bash
        run: bun run install-script:drift-check 2>&1 | tee drift-output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed to read the private website repo's copy; without it only
          # the live site is compared.
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}

      - name: Open (or update) an issue on failure (loud, with the actual message)
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "The scheduled install.sh drift check failed. Run: ${RUN_URL}"
            echo
            echo "Output:"
            echo '```'
            cat drift-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "\"INSTALL.SH PIN DRIFT\": re-run the sync (see the fix line in the output above)."
            echo "\"INSTALL.SH DEPLOY DRIFT\": the repo is current but the live site is stale -- the website's Cloudflare Pages Git integration needs attention (not fixable from this repo)."
            echo "Any other message means the check itself failed to run (network/gh/auth) -- check the run log."
          } > issue-body.txt

          bun run gh:tracking-issue \
            --title "install.sh drift check failed" \
            --body-file issue-body.txt \
            --labels "foundation"
