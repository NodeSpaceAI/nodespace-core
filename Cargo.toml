[workspace]
members = [
    "packages/nodespace-types",
    "packages/core",
    "packages/nlp-engine",
    "packages/agent",
    "packages/proto",
    "packages/daemon",
    "packages/cli",
    "packages/desktop-app/src-tauri",
    "packages/desktop-app/src-tauri/test-support"
]
resolver = "2"

[workspace.package]
# Canonical version for every workspace member crate below (agent, cli, core,
# daemon, nlp-engine, nodespace-types, proto) via `version.workspace = true` in
# each crate's [package] section — a member crate must never hardcode its own
# version, or it silently drifts from the app version that `scripts/release.ts`
# bumps (packages/desktop-app/src-tauri/tauri.conf.json is the ultimate
# canonical source; `scripts/release.ts`'s `release:bump` writes this field too,
# and `scripts/check-version-sync.ts` fails the pre-push gate if it drifts).
# nodespace-daemon reads this at compile time via `env!("CARGO_PKG_VERSION")`
# for both `nodespaced --version` and the `get_daemon_version` gRPC RPC, and
# nodespace-cli's `--version` flag reads it via clap's derived `version` field —
# both are real user/API-facing surfaces, not cosmetic.
version = "0.2.10"
authors = ["NodeSpace Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/malibio/nodespace-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
# default-features = false is load-bearing for the audit gate — see .cargo/audit.toml
# for why (remote/sync/replication/tls pull in a vulnerable rustls-webpki line).
libsql = { version = "0.6", default-features = false, features = ["core"] }
sqlite-vec = "0.1"
tracing = "0.1"
nodespace-types = { path = "packages/nodespace-types" }
nodespace-core = { path = "packages/core" }
nodespace-nlp-engine = { path = "packages/nlp-engine" }
nodespace-agent = { path = "packages/agent" }
nodespace-proto = { path = "packages/proto" }
nodespace-daemon = { path = "packages/daemon" }
tonic = "0.12"
prost = "0.13"

# Dev dependencies (shared via workspace inheritance)
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = 3
strip = true